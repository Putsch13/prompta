<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    html, body { margin: 0; }
    body { width: 380px; background: #111827; color: #e5e7eb; padding: 14px; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .brand { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg,#7c3aed,#4f46e5); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 13px; }
    .title { font-weight: 700; font-size: 14px; flex: 1; color: #fff; }
    .dot-btn { background: none; border: 1px solid #4b5563; color: #9ca3af; border-radius: 8px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
    .dot-btn:hover { border-color: #7c3aed; color: #e5e7eb; }
    textarea { width: 100%; min-height: 80px; resize: vertical; border-radius: 10px; border: 1px solid #4b5563; background: #1f2937; color: #f9fafb; padding: 10px; font-size: 13px; outline: none; }
    textarea:focus { border-color: #7c3aed; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; color: #9ca3af; margin: 8px 0; }
    .chip { background: #1f2937; border: 1px solid #374151; border-radius: 999px; padding: 2px 9px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    label.opt { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #d1d5db; cursor: pointer; margin-bottom: 10px; }
    .send { background: linear-gradient(135deg,#7c3aed,#4f46e5); color: #fff; border: none; border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
    .send:disabled { opacity: .5; cursor: default; }
    .status { font-size: 12px; line-height: 1.5; max-height: 240px; overflow-y: auto; margin-top: 10px; }
    .step { display: flex; gap: 7px; align-items: baseline; padding: 2px 0; }
    .step .ic { width: 14px; text-align: center; }
    .warn { color: #fbbf24; } .err { color: #f87171; white-space: pre-wrap; } .ok { color: #34d399; }
    a { color: #a78bfa; text-decoration: none; }
    .conns { display: none; flex-wrap: wrap; gap: 6px; font-size: 11px; margin-bottom: 10px; }
    .conns.open { display: flex; }
    .conn { display: flex; align-items: center; gap: 4px; background: #1f2937; border-radius: 999px; padding: 2px 8px; }
    .led { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .led.on { background: #34d399; } .led.off { background: #f87171; }
    .hint { font-size: 11px; color: #6b7280; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="row">
    <span class="brand">P</span>
    <span class="title">Prompta — mission instantanée</span>
    <button class="dot-btn" id="conns-toggle">connexions</button>
  </div>
  <div class="conns" id="conns"></div>
  <textarea id="goal" placeholder="Ex. : Compare les produits que j'ai ouverts et fais-moi un tableau dans un Google Sheets, puis envoie-le-moi."></textarea>
  <div class="chips" id="chips"></div>
  <label class="opt"><input type="checkbox" id="alltabs" checked> Voir tout ce que j'ai ouvert (tous mes onglets)</label>
  <label class="opt"><input type="checkbox" id="explore" checked> Autoriser l'exploration des sites (suivre les liens utiles)</label>
  <button class="send" id="send">Lancer l'agent</button>
  <div class="status" id="status"></div>
  <div class="hint">Cmd/Ctrl + Entrée pour lancer. Astuce : épinglez Prompta via l'icône puzzle 🧩 de Chrome.</div>
  <script src="popup.js"></script>
</body>
</html>
