# Render Blueprint — Prompta
# Docs : https://render.com/docs/blueprint-spec

services:
  - type: web
    name: prompta
    runtime: node
    plan: starter
    # npm ci = installation propre reproductible (le cache node_modules de
    # Render + un lockfile qui a beaucoup bougé produit des arbres incohérents).
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Next 16 exige Node >= 20.9 — sans pin, Render garde le défaut figé à
      # la création du service (Render ne lit PAS engines de package.json).
      # Doublé par .node-version à la racine.
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: PLATFORM_OPENAI_KEY
        sync: false
      - key: PLATFORM_ANTHROPIC_KEY
        sync: false
      - key: PLATFORM_GOOGLE_KEY
        sync: false
      - key: PLATFORM_MISTRAL_KEY
        sync: false
      - key: PLATFORM_SERPER_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: AGENT_MODEL
        sync: false
      - key: PLATFORM_DAILY_COST_CAP_CENTS
        sync: false

  - type: worker
    name: prompta-worker
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      # Supabase
      - fromService:
          type: web
          name: prompta
          envVarKey: NEXT_PUBLIC_SUPABASE_URL
      - fromService:
          type: web
          name: prompta
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      # Chiffrement clés BYOK
      - fromService:
          type: web
          name: prompta
          envVarKey: ENCRYPTION_KEY
      # Clés plateforme (runs crédits)
      - fromService:
          type: web
          name: prompta
          envVarKey: PLATFORM_OPENAI_KEY
      - fromService:
          type: web
          name: prompta
          envVarKey: PLATFORM_ANTHROPIC_KEY
      - fromService:
          type: web
          name: prompta
          envVarKey: PLATFORM_GOOGLE_KEY
      - fromService:
          type: web
          name: prompta
          envVarKey: PLATFORM_MISTRAL_KEY
      - fromService:
          type: web
          name: prompta
          envVarKey: PLATFORM_SERPER_KEY
      # Agents admin
      - fromService:
          type: web
          name: prompta
          envVarKey: ANTHROPIC_API_KEY
      - fromService:
          type: web
          name: prompta
          envVarKey: AGENT_MODEL
      # Connecteurs
      - fromService:
          type: web
          name: prompta
          envVarKey: COMPOSIO_API_KEY
      # Sandbox
      - fromService:
          type: web
          name: prompta
          envVarKey: E2B_API_KEY
      # Billing
      - fromService:
          type: web
          name: prompta
          envVarKey: PLATFORM_DAILY_COST_CAP_CENTS
      # App URL (pour callbacks)
      - fromService:
          type: web
          name: prompta
          envVarKey: NEXT_PUBLIC_APP_URL
      # Cron secret
      - fromService:
          type: web
          name: prompta
          envVarKey: CRON_SECRET
      # Emails (notification de validation humaine envoyée par le worker)
      - fromService:
          type: web
          name: prompta
          envVarKey: RESEND_API_KEY
