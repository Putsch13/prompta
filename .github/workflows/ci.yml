name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTY0NTI2NzQwMCwiZXhwIjoxOTYwODQzNDAwfQ.placeholder # pragma: allowlist secret
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUiLCJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNjQ1MjY3NDAwLCJleHAiOjE5NjA4NDM0MDB9.placeholder # pragma: allowlist secret
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_APP_URL: https://example.com
      CRON_SECRET: ci-cron-secret-placeholder-0123456789abcdef
      STRIPE_SECRET_KEY: sk_test_ci_placeholder # pragma: allowlist secret
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secrets scan
        run: npm run secrets:scan

      - name: Unit tests
        run: npm run test:unit

      # Seul test d'EXÉCUTION de l'orchestrateur du dépôt (parallel, reprise,
      # variables imbriquées) — il tournait déjà sans clé ni serveur, mais
      # n'était lancé par personne.
      - name: Integration tests
        run: npm run test:integration

      # Le catalogue des 100 agents contre le schéma runtime + le validateur
      # builder : détecte une régression de schéma avant le déploiement.
      - name: Complex agent catalog
        run: npm run validate:complex-agents

      - name: Production build
        run: npm run build

      # Parcours public (redirections des surfaces coupées, pages légales,
      # pricing, fail-closed des APIs sensibles) contre le build réel. La suite
      # existait mais n'était lancée par personne : elle avait dérivé de deux
      # versions du produit (grille tarifaire, retour de /cas-usage).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts démarre `npm start` sur le build produit à l'étape
      # précédente et l'arrête à la fin.
      - name: End-to-end tests
        run: npx playwright test
